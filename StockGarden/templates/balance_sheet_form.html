{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>Create Balance Sheet</h1>
    {% if messages %}
        <div class="alert alert-info">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="report_date" class="form-label">Report Date</label>
            <input type="date" class="form-control" id="report_date" name="report_date" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="is_final" name="is_final">
            <label class="form-check-label" for="is_final">Finalized</label>
        </div>
        <div class="mb-3">
            <label for="notes" class="form-label">Notes</label>
            <textarea class="form-control" id="notes" name="notes"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'balance_sheet_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
